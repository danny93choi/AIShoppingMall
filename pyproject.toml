[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-commerce-agent"
version = "0.1.0"
description = "Multi-tenant AI Commerce Agent platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2.0",
  "cryptography>=45.0,<47.0",
  "fastapi>=0.115,<1.0",
  "httpx>=0.28,<1.0",
  "openai>=2.0,<3.0",
  "pydantic-settings>=2.7,<3.0",
  "redis>=5.2,<7.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "asyncpg>=0.30,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "mypy>=1.14,<2.0",
  "pre-commit>=4.0,<5.0",
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.25,<1.0",
  "ruff>=0.9,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/commerce_agent", "apps"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["apps", "src", "tests"]
extend-exclude = ["AI_Commerce_Agent_Implementation_Spec.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["apps", "commerce_agent", "tests"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: tests that exercise infrastructure boundaries",
]
