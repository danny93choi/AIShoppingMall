<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI Commerce Control Room</title>
  <style>
    :root{--ink:#17211b;--muted:#66736b;--paper:#f5f3ec;--card:#fffdf7;--line:#d8d8cd;--accent:#176b4d;--warn:#c76b27;--bad:#ad3d3d}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 ui-sans-serif,system-ui,-apple-system,sans-serif}
    header{padding:28px max(24px,5vw);background:#163d2e;color:white;display:flex;gap:24px;justify-content:space-between;align-items:center;flex-wrap:wrap}
    h1{margin:0;font:700 28px/1.1 Georgia,serif}.sub{opacity:.75;margin-top:6px}.auth{display:flex;gap:8px;flex-wrap:wrap}
    input,button{border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:white}input{width:220px}button{cursor:pointer;font-weight:700}.primary{background:#d9f26a;border-color:#d9f26a;color:#173221}
    main{padding:28px max(24px,5vw) 60px}.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}.status{color:var(--muted)}
    .trend-controls{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr)) auto;gap:10px;align-items:end;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:22px}.trend-controls label{font-size:12px;color:var(--muted)}.trend-controls input,.trend-controls select{display:block;width:100%;margin-top:4px;border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:white}.source-note{font-size:12px;color:var(--accent);margin-top:4px;grid-column:1/-1}.direct-only{display:none}
    .metrics{display:grid;grid-template-columns:repeat(4,minmax(130px,1fr));gap:14px;margin-bottom:24px}.metric,.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 4px 20px #1d33220a}.metric{padding:18px}.metric b{font-size:27px;display:block}.metric span{color:var(--muted)}
    .grid{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}.panel{padding:20px;overflow:auto}.panel h2{font:700 20px Georgia,serif;margin:0 0 15px}table{border-collapse:collapse;width:100%;min-width:620px}th,td{text-align:left;padding:11px;border-bottom:1px solid #e7e5dc;vertical-align:top}th{font-size:12px;text-transform:uppercase;color:var(--muted)}
    .badge{display:inline-block;border-radius:999px;padding:3px 8px;background:#e5ece7;font-size:12px}.pending{background:#fff0c9}.approved,.succeeded{background:#d7f1dc}.rejected,.failed{background:#f8d8d8}.actions{display:flex;gap:5px}.actions button{padding:5px 8px;font-size:12px}.score{font:700 20px Georgia,serif}.breakdown{font-size:12px;color:var(--muted);max-width:260px}.stack{display:grid;gap:10px}.item{padding:12px;border:1px solid #e4e2d8;border-radius:10px}.item strong{display:block}.error{color:var(--bad)}
    .trend-panel{margin-bottom:18px}.trend-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}.trend-card{border:1px solid #e4e2d8;border-radius:12px;padding:15px;background:#fff}.trend-head{display:flex;justify-content:space-between;gap:12px;align-items:start}.trend-name{font-size:18px;font-weight:800}.trend-value{font-size:24px;font-weight:800}.change{font-size:13px;font-weight:700}.up{color:var(--accent)}.down{color:var(--bad)}.chart{width:100%;height:120px;margin:10px 0 4px;overflow:visible}.chart-labels{display:flex;justify-content:space-between;color:var(--muted);font-size:11px}.trend-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}.trend-stats div{background:var(--paper);border-radius:7px;padding:7px;font-size:11px;color:var(--muted)}.trend-stats b{display:block;color:var(--ink);font-size:13px}.empty{padding:22px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);line-height:1.7}.missing{font-size:11px;color:var(--warn);margin-top:5px}
    dialog{border:0;border-radius:16px;padding:22px;max-width:620px;width:calc(100% - 32px);box-shadow:0 20px 80px #0004}dialog::backdrop{background:#0008}.evidence-form{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.evidence-form label{font-size:12px;color:var(--muted)}.evidence-form input{display:block;width:100%;margin-top:4px}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
    @media(max-width:900px){.grid{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.trend-controls{grid-template-columns:1fr}}
  </style>
</head>
<body>
<header><div><h1>AI Commerce Control Room</h1><div class="sub">상품 발견부터 승인, 실행 추적까지</div></div><div class="auth"><input id="tenant" placeholder="Tenant UUID"><input id="actor" placeholder="Actor UUID"><input id="roles" value="owner" placeholder="Roles"><button onclick="connect()">연결</button><button onclick="resetConnection()">연결 정보 초기화</button></div></header>
<main><div class="toolbar"><button onclick="load()">새로고침</button><span class="status" id="status">Tenant 정보를 입력하세요.</span></div>
<section class="trend-controls"><label>조사 방식<select id="discoveryMode" onchange="toggleMode()"><option value="auto">자동 상품 발굴</option><option value="direct">키워드 직접 비교</option></select></label><label>쇼핑 대분류<select id="categoryCode" onchange="refreshSubcategories()"><option value="50000008">생활/건강</option><option value="50000004">가구/인테리어</option><option value="50000003">디지털/가전</option><option value="50000006">식품</option><option value="50000007">스포츠/레저</option><option value="50000002">화장품/미용</option><option value="50000000">패션의류</option><option value="50000001">패션잡화</option><option value="50000005">출산/육아</option><option value="50000009">여가/생활편의</option></select></label><label>세부 상품군<select id="subcategory"></select></label><label>최소 월간 검색량<input id="minimumSearches" type="number" value="3000" min="10"></label><label>제외할 단어<input id="excludeTerms" placeholder="식품, 대형, 해외직구"></label><label class="direct-only" id="directKeywords">직접 비교 키워드<input id="keywords" placeholder="최대 20개, 쉼표 구분"></label><button class="primary" onclick="discover()">20개 상품 후보 발굴</button><div class="source-note">선택한 세부 상품군 → 네이버 검색광고 후보 수집 → 구매의도 필터 → 쇼핑인사이트 1년 추이 교차검증</div></section>
<section class="metrics" id="metrics"></section>
<section class="panel trend-panel"><h2>네이버 쇼핑 트렌드 추이</h2><div class="trend-grid" id="trendCharts"></div></section>
<section class="panel trend-panel"><h2>자동 발굴 품질 검토</h2><div id="qualityReview"></div></section>
<div class="grid"><section class="panel"><h2>시장조사 추천</h2><div id="recommendations"></div></section><section class="panel"><h2>데이터 연결</h2><div class="stack" id="connections"></div><h2 style="margin-top:26px">조사 실행 기록</h2><div class="stack" id="jobs"></div></section><section class="panel"><h2>조사 데이터 상세</h2><div id="candidates"></div></section><section class="panel"><h2>판매 준비</h2><div class="stack" id="drafts"></div><h2 style="margin-top:26px">AI Agent 실행</h2><div class="stack" id="agents"></div></section></div></main>
<dialog id="evidenceDialog"><h2 id="evidenceTitle">판매조건 입력</h2><div class="evidence-form"><label>공급처 이름<input id="supplierName" placeholder="공급처 또는 도매처"></label><label>공급가(원)<input id="supplierCost" type="number" min="0"></label><label>예상 판매가(원)<input id="salePrice" type="number" min="1"></label><label>개당 배송비(원)<input id="unitShipping" type="number" min="0" value="0"></label><label>최소 주문수량(MOQ)<input id="moq" type="number" min="1" value="1"></label><label>확인한 경쟁가격(원)<input id="competitorPrice" type="number" min="1" placeholder="선택 입력"></label><label>마켓 수수료율<input id="feeRate" type="number" min="0" max="0.5" step="0.01" value="0.12"></label><label>예상 광고비율<input id="adRate" type="number" min="0" max="0.5" step="0.01" value="0.05"></label></div><div class="dialog-actions"><button onclick="$('evidenceDialog').close()">취소</button><button class="primary" onclick="saveEvidence()">저장 및 계산</button></div></dialog>
<script>
const $=id=>document.getElementById(id);let data={};
const subcategories={'50000000':['여성의류','남성의류','여성아우터','남성아우터','원피스','여성상의','남성상의','여성하의','남성하의','청바지','트레이닝복','언더웨어','잠옷','아동의류','스포츠의류'],'50000001':['여성가방','남성가방','여성신발','남성신발','운동화','지갑','벨트','시계','주얼리','모자','선글라스','안경','양말','우산','여행가방','패션소품'],'50000002':['스킨케어','클렌징','선케어','마스크팩','메이크업','립메이크업','향수','헤어케어','헤어스타일링','바디케어','네일케어','남성화장품','미용기기','미용소품'],'50000003':['생활가전','주방가전','계절가전','컴퓨터주변기기','모바일액세서리','음향기기','영상가전','카메라','게임기','노트북','태블릿','스마트워치','저장장치','네트워크장비','프린터'],'50000004':['침실가구','거실가구','주방가구','학생가구','사무용가구','수납가구','아웃도어가구','침구','커튼','카페트','조명','홈데코','인테리어소품','DIY자재','욕실인테리어'],'50000005':['유아동의류','유아동신발','유아식품','분유','기저귀','물티슈','수유용품','이유식용품','유모차','카시트','아기띠','유아가구','출산준비물','목욕용품','완구','교구'],'50000006':['간편식','건강식품','다이어트식품','음료','커피','차','과자','베이커리','농산물','쌀','축산물','수산물','냉동식품','반찬','면류','조미료','유제품','생수'],'50000007':['홈트레이닝','헬스','요가','캠핑','등산','골프','자전거','수영','낚시','러닝','테니스','배드민턴','축구','농구','스키','보드','스포츠보호용품'],'50000008':['주방용품','수납정리용품','청소용품','욕실용품','건강측정용품','공구','생활안전용품','계절생활용품','세탁용품','구강용품','위생용품','안마용품','건강관리용품','의료용품','원예용품','보안용품','생활잡화'],'50000009':['강아지용품','고양이용품','반려동물식품','자동차용품','오토바이용품','문구','사무용품','악기','취미공예','수집품','보드게임','꽃','여행용품','숙박','공연티켓','e쿠폰']};
function refreshSubcategories(){let values=subcategories[$('categoryCode').value]||[];$('subcategory').innerHTML=values.map(x=>`<option value="${x}">${x}</option>`).join('')}
function headers(){return {'Content-Type':'application/json','X-Tenant-ID':$('tenant').value.trim(),'X-Actor-ID':$('actor').value.trim(),'X-Roles':$('roles').value.trim()}}
function connect(){localStorage.aiTenant=$('tenant').value.trim();localStorage.aiActor=$('actor').value.trim();localStorage.aiRoles=$('roles').value.trim()||'owner';restoreConnection();load()}
function restoreConnection(){$('tenant').value=localStorage.aiTenant||'';$('actor').value=localStorage.aiActor||'';$('roles').value=localStorage.aiRoles||'owner'}
function resetConnection(){localStorage.removeItem('aiTenant');localStorage.removeItem('aiActor');localStorage.removeItem('aiRoles');restoreConnection();data={};$('metrics').innerHTML='';$('status').textContent='연결 정보를 초기화했습니다.'}
function errorMessage(payload,fallback){let detail=payload&&payload.detail;if(Array.isArray(detail))return detail.map(x=>`${(x.loc||[]).slice(-1)[0]||'요청'}: ${x.msg||'잘못된 값'}`).join(' · ');if(detail&&typeof detail==='object')return detail.message||JSON.stringify(detail);return detail||fallback}
async function api(url,opts={}){let r=await fetch(url,{...opts,headers:{...headers(),...(opts.headers||{})}});if(!r.ok){let payload={};try{payload=await r.json()}catch{}throw new Error(errorMessage(payload,r.statusText))}return r.json()}
async function load(){try{$('status').textContent='불러오는 중…';data=await api('/api/v1/admin/overview');render();$('status').textContent='마지막 갱신 '+new Date().toLocaleTimeString()}catch(e){$('status').textContent=e.message}}
function toggleMode(){$('directKeywords').style.display=$('discoveryMode').value==='direct'?'block':'none'}
async function discover(){try{let mode=$('discoveryMode').value,keywords=$('keywords').value.split(',').map(x=>x.trim()).filter(Boolean).slice(0,20),exclude_terms=$('excludeTerms').value.split(',').map(x=>x.trim()).filter(Boolean);$('status').textContent=mode==='auto'?'최대 20개 상품의 최근 1년 추이 조사 중…':'입력 키워드의 최근 1년 추이 조사 중…';let result=await api('/api/v1/admin/discovery',{method:'POST',body:JSON.stringify({source:'naver',mode,category_code:$('categoryCode').value.trim(),subcategory:mode==='auto'?$('subcategory').value:null,keywords,exclude_terms,minimum_monthly_searches:Number($('minimumSearches').value||3000),window_days:365})});await load();$('status').textContent=`${result.status} · ${result.selected_keywords.length}개 1년 조사 완료 · `+new Date().toLocaleTimeString()}catch(e){$('status').textContent=e.message}}
async function decide(id,verb){try{await api(`/api/v1/recommendations/${id}/${verb}`,{method:'POST',body:'{}'});await load()}catch(e){alert(e.message)}}
async function draft(id){try{await api(`/api/v1/recommendations/${id}/marketing-draft`,{method:'POST'});await load()}catch(e){alert(e.message)}}
function openEvidence(id){let candidate=(data.candidates||[]).find(x=>x.id===id)||{},name=candidate.name||'상품',e=candidate.trend&&candidate.trend.commercial_evidence||{};$('evidenceDialog').dataset.candidate=id;$('evidenceTitle').textContent=name+' 판매조건';$('supplierName').value=e.supplier_name||'';$('supplierCost').value=e.supplier_cost||'';$('salePrice').value=e.expected_sale_price||'';$('unitShipping').value=e.shipping_per_unit||0;$('moq').value=e.minimum_order_quantity||1;$('competitorPrice').value=e.competitor_price||'';$('feeRate').value=e.marketplace_fee_rate??0.12;$('adRate').value=e.ad_cost_rate??0.05;$('evidenceDialog').showModal()}
async function saveEvidence(){try{let id=$('evidenceDialog').dataset.candidate,competitor=$('competitorPrice').value;await api(`/api/v1/admin/candidates/${id}/commercial-evidence`,{method:'PUT',body:JSON.stringify({supplier_name:$('supplierName').value.trim(),supplier_cost:Number($('supplierCost').value),expected_sale_price:Number($('salePrice').value),shipping_per_unit:Number($('unitShipping').value||0),minimum_order_quantity:Number($('moq').value||1),competitor_price:competitor?Number(competitor):null,marketplace_fee_rate:Number($('feeRate').value||0),ad_cost_rate:Number($('adRate').value||0)})});$('evidenceDialog').close();await load()}catch(e){alert(e.message)}}
const badge=s=>`<span class="badge ${s}">${s}</span>`;
function lineChart(series){let values=series.map(x=>Number(x.ratio)),min=Math.min(...values),max=Math.max(...values),range=max-min||1,points=values.map((v,i)=>`${10+i*280/Math.max(values.length-1,1)},${105-(v-min)*90/range}`).join(' ');return `<svg class="chart" viewBox="0 0 300 115" role="img" aria-label="최근 1년 월별 트렌드 선 그래프"><line x1="10" y1="105" x2="290" y2="105" stroke="#d8d8cd"/><line x1="10" y1="60" x2="290" y2="60" stroke="#ecebe5"/><polyline points="${points}" fill="none" stroke="#176b4d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`}
function pct(value,sign=true){let n=Number(value||0)*100;return `${sign&&n>0?'+':''}${n.toFixed(1)}%`}
function renderCharts(candidates){$('trendCharts').innerHTML=candidates.map(x=>{let t=x.trend||{},a=t.analysis||{},q=t.search_demand||{},s=t.series||[],growth=Number(t.growth||0)*100,start=s[0]&&s[0].period||'',end=s.at(-1)&&s.at(-1).period||'',peaks=(a.peak_months||[]).map(m=>m+'월').join(', ')||'-';return `<article class="trend-card"><div class="trend-head"><div><div class="trend-name">${x.name}</div><span class="badge approved">NAVER REAL</span> <span class="badge">계절성 ${a.seasonality_strength||'-'}</span></div><div><div class="trend-value">${Number(t.latest_ratio||0).toFixed(2)}</div><div class="change ${growth>=0?'up':'down'}">전월 대비 ${growth>=0?'+':''}${growth.toFixed(1)}%</div></div></div>${s.length?lineChart(s):'<div class="empty">추이 데이터가 없습니다.</div>'}<div class="chart-labels"><span>${start}</span><span>월별 클릭 지수</span><span>${end}</span></div><div class="trend-stats"><div>월간 검색량<b>${Number(q.monthly_searches||0).toLocaleString()}</b></div><div>데이터 범위<b>${Number(a.periods||0)}/12개월</b></div><div>광고 경쟁도<b>${q.competition||'-'}</b></div><div>최근 3개월<b>${pct(a.change_3m)}</b></div><div>1년 전체 변화<b>${pct(a.change_period)}</b></div><div>계절성 강도<b>${a.seasonality_strength||'-'}</b></div><div>예상 성수기<b>${a.seasonality_strength==='데이터 부족'?'-':peaks}</b></div><div>진입 시점<b>${a.entry_timing||'-'}</b></div><div>1년 평균<b>${Number(a.average_ratio||0).toFixed(2)}</b></div></div><div class="missing">${a.entry_guidance||''}</div></article>`}).join('')||'<div class="empty">아직 네이버 실데이터가 없습니다. 자동 상품 발굴을 실행하세요.</div>'}
function render(){let m=data.market_recommendations||[],c=(data.candidates||[]).filter(x=>x.trend&&x.trend.real_data),j=data.jobs||[],d=data.marketing_drafts||[],quality=data.discovery_quality||{},excluded=quality.excluded||[],missing=quality.missing_trend_keywords||[],refinement=quality.refinement_seeds||[],rising=c.filter(x=>Number(x.trend.growth)>0).length,falling=c.filter(x=>Number(x.trend.growth)<0).length;$('metrics').innerHTML=[['실제 조사 상품',c.length],['상승',rising],['하락',falling],['판매조건 검증',c.filter(x=>x.trend.commercial_evidence).length]].map(x=>`<div class="metric"><b>${x[1]}</b><span>${x[0]}</span></div>`).join('');renderCharts(c);$('qualityReview').innerHTML=`<div class="item"><strong>상품 발굴 품질 검토${quality.subcategory?' · '+quality.subcategory:''}</strong>검색량·쇼핑 클릭 의도·키워드 구체성으로 선별합니다.${refinement.length?`<br>세부 상품 재탐색: ${refinement.join(', ')}`:''}${missing.length?`<br><span class="error">트렌드 데이터 미제공: ${missing.join(', ')}</span>`:''}</div>${excluded.length?`<div class="status">제외·보완 ${excluded.length}개 중 상위 20개 표시</div><table><tr><th>제외/보완 키워드</th><th>판정</th><th>이유</th></tr>${excluded.slice(0,20).map(x=>`<tr><td><strong>${x.keyword}</strong></td><td>${badge(x.status==='exclude'?'rejected':'pending')} ${Number(x.quality_score).toFixed(1)}</td><td>${(x.reasons||[]).join(' ')}</td></tr>`).join('')}</table>`:'<div class="empty">제외되거나 구체화가 필요한 키워드가 없습니다.</div>'}`;
$('recommendations').innerHTML=m.length?`<table><tr><th>순위</th><th>키워드</th><th>시장성</th><th>판정 근거</th></tr>${m.map(x=>`<tr><td>#${x.rank}</td><td><strong>${x.name}</strong><br><span class="badge approved">${x.verdict}</span></td><td class="score">${Number(x.score).toFixed(1)}</td><td class="breakdown">${x.reason}<br>월 검색 ${Number(x.search_demand&&x.search_demand.monthly_searches||0).toLocaleString()} · 경쟁 ${x.search_demand&&x.search_demand.competition||'-'} · 3개월 ${pct(x.metrics.change_3m)} · 계절성 ${x.metrics.seasonality_strength||'-'} · 성수기 ${(x.metrics.peak_months||[]).map(v=>v+'월').join(', ')||'-'}<div class="missing">추가 필요: ${x.missing_evidence.join(', ')}</div></td></tr>`).join('')}</table>`:'<div class="empty">자동 발굴을 실행하면 정량 근거를 바탕으로 시장조사 순위를 표시합니다.</div>';
$('candidates').innerHTML=`<table><tr><th>상품 키워드</th><th>품질</th><th>판매조건</th><th>예상 마진</th><th>입력</th></tr>${c.map(x=>{let q=x.trend.keyword_quality||{},e=x.trend.commercial_evidence||{};return `<tr><td><strong>${x.name}</strong></td><td>${Number(q.quality_score||0).toFixed(1)}<br><span class="breakdown">${(q.reasons||[]).join(' ')}</span></td><td>${e.verdict?`${badge(e.verdict==='판매 보류'?'rejected':'approved')}<br>공급 ${Number(e.supplier_cost).toLocaleString()}원 · 판매 ${Number(e.expected_sale_price).toLocaleString()}원<br>MOQ ${e.minimum_order_quantity}`:'검증 필요'}</td><td>${e.verdict?`${pct(e.expected_margin_rate,false)}<br>개당 ${Number(e.expected_profit).toLocaleString()}원<br>손익분기 ${Number(e.break_even_price).toLocaleString()}원`:'-'}</td><td><button onclick="openEvidence('${x.id}')">${e.verdict?'수정':'판매조건 입력'}</button></td></tr>`}).join('')}</table>`;
$('connections').innerHTML=(data.connections||[]).map(x=>`<div class="item"><strong>${x.name}</strong>${x.provider} · ${badge(x.status)}</div>`).join('')||'<div class="item">연결 없음</div>';
$('jobs').innerHTML=j.map(x=>`<div class="item"><strong>${badge(x.status)} ${x.progress}%</strong>${x.step||'완료'}${x.errors.length?`<div class="error">오류 ${x.errors.length}</div>`:''}</div>`).join('')||'<div class="item">실행 기록 없음</div>';
$('drafts').innerHTML=d.map(x=>`<div class="item"><strong>${x.content.positioning||'Marketing draft'}</strong>검증 필요: ${x.claims_to_verify.join(', ')}</div>`).join('')||'<div class="item">초안 없음</div>';
$('agents').innerHTML=(data.agent_runs||[]).map(x=>`<div class="item"><strong>${x.agent} ${badge(x.status)}</strong>${x.model||'offline'} · $${x.cost}${x.error?`<div class="error">${x.error}</div>`:''}</div>`).join('')||`<div class="empty"><strong>현재 AI Agent는 동작하지 않습니다.</strong>${data.ai_agent&&data.ai_agent.enabled?'API 키는 있지만 트렌드 분석 워크플로에 아직 연결되지 않았습니다.':'OPENAI_API_KEY가 설정되지 않았고 트렌드 분석 워크플로에도 연결되지 않았습니다.'}<br>현재 추천은 네이버 실데이터를 사용한 재현 가능한 정량 계산입니다.</div>`}
refreshSubcategories();toggleMode();restoreConnection();if($('tenant').value&&$('actor').value)load();
</script></body></html>
